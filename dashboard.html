<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kwala Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Add Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bento-dashboard-body">

<aside class="bento-sidebar">
    <div class="bento-sidebar-nav">
        <div class="bento-nav-item active">Dashboard</div>
        <a href="analytics.html" class="bento-nav-item">Analytics</a>
        <div class="bento-nav-item">Reports</div>
        <div class="bento-nav-item">Settings</div>
        <div class="bento-nav-item">Profile</div>
    </div>
</aside>

<main class="bento-main-content">
    <!-- Top Section: Main Grid -->
    <div class="bento-grid-container">
        <!-- Left Column with KPIs and Line Plot -->
        <div class="bento-left-column">
            <div class="kpi-grid">
                <div class="kpi-card">
                    <div class="kpi-title">Today's Revenue</div>
                    <div class="kpi-value">$1,250</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-title">Today's Orders</div>
                    <div class="kpi-value">55</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-title">Average Order Value</div>
                    <div class="kpi-value">$22.73</div>
                </div>
            </div>
            <div class="bento-card main-graph">
                <canvas id="ordersChart"></canvas>
            </div>
        </div>
        <!-- Right Column with Activity Feed -->
        <div class="bento-right-column">
            <div class="bento-card activity-feed">
                <h3>Recent Orders</h3>
                <div class="table-container">
                    <table>
                        <tbody>
                            <tr>
                                <td>#KW1254</td>
                                <td>John Doe</td>
                                <td>$25.50</td>
                            </tr>
                            <tr>
                                <td>#KW1253</td>
                                <td>Jane Smith</td>
                                <td>$15.00</td>
                            </tr>
                            <tr>
                                <td>#KW1252</td>
                                <td>Mike Johnson</td>
                                <td>$40.10</td>
                            </tr>
                            <tr>
                                <td>#KW1251</td>
                                <td>Sara Williams</td>
                                <td>$8.75</td>
                            </tr>
                             <tr>
                                <td>#KW1250</td>
                                <td>Chris Brown</td>
                                <td>$32.00</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Section: Yearly Sales Bar Chart -->
    <div class="yearly-sales-container">
        <div class="bento-card">
            <h3>Yearly Sales</h3>
            <canvas id="yearlySalesChart"></canvas>
        </div>
    </div>
</main>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        // 1. Orders Line Chart
        const lineCtx = document.getElementById('ordersChart').getContext('2d');
        const lineGradient = lineCtx.createLinearGradient(0, 0, 0, 300);
        lineGradient.addColorStop(0, 'rgba(220, 208, 240, 0.8)');
        lineGradient.addColorStop(1, 'rgba(220, 208, 240, 0)');

        new Chart(lineCtx, {
            type: 'line',
            data: {
                labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                datasets: [{
                    label: 'Orders',
                    data: [12, 19, 8, 17, 22, 30, 25],
                    backgroundColor: lineGradient,
                    borderColor: '#463C6E',
                    borderWidth: 3,
                    pointBackgroundColor: '#463C6E',
                    pointRadius: 5,
                    tension: 0.4,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { y: { beginAtZero: true } },
                plugins: { legend: { display: false } }
            }
        });

        // 2. Yearly Sales Bar Chart
        const barCtx = document.getElementById('yearlySalesChart').getContext('2d');
        new Chart(barCtx, {
            type: 'bar',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
                datasets: [{
                    label: 'Monthly Sales',
                    data: [12000, 19000, 15000, 21000, 18000, 22000, 25000, 23000, 20000, 24000, 27000, 30000],
                    backgroundColor: '#DCD0F0',
                    borderColor: '#463C6E',
                    borderWidth: 1,
                    borderRadius: 8
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { y: { beginAtZero: true } },
                plugins: { legend: { display: false } }
            }
        });
    });
</script>

</body>
</html>
