<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kwala Dashboard</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bento-dashboard-body">

<!-- ===========================
     SIDEBAR NAVIGATION
     Contains: Logo, Navigation links, Logout
=========================== -->
<aside class="bento-sidebar">
    <div class="sidebar-logo">
        <span class="logo-icon">Kwala</span>
    </div>
    <div class="bento-sidebar-nav">
        <div class="bento-nav-item active">
            <a href="dashboard.html"><i class="fas fa-th-large"></i><span>Dashboard</span></a>
        </div>
        <div class="bento-nav-item">
            <a href="analytics.html"><i class="fas fa-chart-line"></i><span>Analytics</span></a>
        </div>
        <div class="bento-nav-item">
            <a href="#"><i class="fas fa-file-alt"></i><span>Reports</span></a>
        </div>
        <div class="bento-nav-item">
            <a href="#"><i class="fas fa-cog"></i><span>Settings</span></a>
        </div>
        <div class="bento-nav-item">
            <a href="profile.html"><i class="fas fa-user"></i><span>Profile</span></a>
        </div>
    </div>
    <div class="sidebar-footer">
        <a href="login.html" class="sidebar-login">Login</a>
    </div>
</aside>

<!-- ===========================
     MAIN CONTENT AREA
=========================== -->
<main class="bento-main-content">

    <div style="background: #1e1e2f; color: #00ffcc; padding: 15px; margin-bottom: 20px; border-radius: 8px; max-height: 400px; overflow-y: auto;">
        <h4 style="margin-top: 0; color: #fff;">API Response Debug (<a href="#" onclick="document.getElementById('apiDebugOutput').innerHTML = 'Cleared.'; return false;" style="color:#00ffcc;">Clear</a>)</h4>
        <pre id="apiDebugOutput" style="font-family: monospace; font-size: 12px; white-space: pre-wrap; word-wrap: break-word;">Waiting for API response...</pre>
    </div>

    <!-- ===========================
         1. GREETING + TIME FRAME BAR
    =========================== -->
    <div class="dash-greeting-bar">
        <h1 class="dash-greeting" id="dashGreeting">Good morning</h1>
        <div class="dash-controls">
            <div class="timeframe-pills">
                <button class="tf-pill" data-range="24h">24 hours</button>
                <button class="tf-pill" data-range="7d">7 days</button>
                <button class="tf-pill" data-range="30d">30 days</button>
                <button class="tf-pill active" data-range="12m">12 months</button>
            </div>
            <button class="dash-btn-outline" id="btnSelectDates">
                <i class="fas fa-calendar-alt"></i> Select dates
            </button>
            <select id="statusSelect" class="dash-select-status" aria-label="Order status">
                <option value="delivered">Completed</option>
                <option value="preparing">Preparing</option>
                <option value="prepared">Prepared</option>
                <option value="in_progress">In Progress</option>
            </select>
            <button class="dash-btn-outline" id="btnFilters">
                <i class="fas fa-sliders-h"></i> Filters
            </button>
        </div>
    </div>

    <!-- ===========================
         2. KPI CARDS (full-width row)
    =========================== -->
    <div class="kpi-grid">
        <!-- KPI 1: Revenue -->
        <div class="kpi-card">
            <div class="kpi-accent">
                <svg viewBox="0 0 36 36" class="kpi-ring">
                    <circle cx="18" cy="18" r="15" fill="none" stroke="#EDE9FE" stroke-width="4"/>
                    <circle cx="18" cy="18" r="15" fill="none" stroke="#7C3AED" stroke-width="4" stroke-dasharray="70 100" stroke-linecap="round" transform="rotate(-90 18 18)"/>
                </svg>
            </div>
            <div class="kpi-info">
                <div class="kpi-title">Revenue</div>
                <div class="kpi-value">$<span class="counter" data-target="46740">0</span></div>
            </div>
            <span class="kpi-trend up">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" width="12" height="12"><path d="M7 17l5-5 5 5"/></svg>
                12%
            </span>
        </div>
        <!-- KPI 2: Users -->
        <div class="kpi-card">
            <div class="kpi-accent">
                <svg viewBox="0 0 36 36" class="kpi-ring">
                    <circle cx="18" cy="18" r="15" fill="none" stroke="#D1FAE5" stroke-width="4"/>
                    <circle cx="18" cy="18" r="15" fill="none" stroke="#10B981" stroke-width="4" stroke-dasharray="55 100" stroke-linecap="round" transform="rotate(-90 18 18)"/>
                </svg>
            </div>
            <div class="kpi-info">
                <div class="kpi-title">Users</div>
                <div class="kpi-value"><span class="counter" data-target="380">0</span></div>
            </div>
            <span class="kpi-trend down">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" width="12" height="12"><path d="M7 7l5 5 5-5"/></svg>
                0.5%
            </span>
        </div>
        <!-- KPI 3: Sales -->
        <div class="kpi-card">
            <div class="kpi-accent">
                <svg viewBox="0 0 36 36" class="kpi-ring">
                    <circle cx="18" cy="18" r="15" fill="none" stroke="#DBEAFE" stroke-width="4"/>
                    <circle cx="18" cy="18" r="15" fill="none" stroke="#3B82F6" stroke-width="4" stroke-dasharray="60 100" stroke-linecap="round" transform="rotate(-90 18 18)"/>
                </svg>
            </div>
            <div class="kpi-info">
                <div class="kpi-title">Sales</div>
                <div class="kpi-value"><span class="counter" data-target="1328">0</span></div>
            </div>
            <span class="kpi-trend up">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" width="12" height="12"><path d="M7 17l5-5 5 5"/></svg>
                3.7%
            </span>
        </div>
    </div>

    <!-- ===========================
         3. CHARTS SECTION (Revenue overview + side KPIs)
    =========================== -->
    <div class="dash-charts-row">
        <!-- Main Chart -->
        <div class="dash-chart-main">
            <div class="dash-chart-header">
                <div class="dash-chart-title">
                    <span>Revenue overview</span>
                    <i class="fas fa-info-circle" style="color:#aaa; font-size:0.8rem; margin-left:4px;"></i>
                </div>
                <div class="dash-chart-actions">
                    <span class="chart-legend-dot" style="background:#7C3AED;"></span> 2025
                    <span class="chart-legend-dot" style="background:#DCD0F0; margin-left:12px;"></span> 2024
                    <button class="dash-btn-sm purple"><i class="fas fa-download"></i> Export</button>
                    <button class="dash-btn-sm"><i class="fas fa-ellipsis-h"></i></button>
                </div>
            </div>
            <div class="dash-chart-canvas-wrap">
                <canvas id="ordersChart"></canvas>
            </div>
        </div>
        <!-- Side KPIs -->
        <div class="dash-side-kpis">
            <div class="kpi-card mini">
                <div class="kpi-accent">
                    <svg viewBox="0 0 36 36" class="kpi-ring">
                        <circle cx="18" cy="18" r="15" fill="none" stroke="#DBEAFE" stroke-width="4"/>
                        <circle cx="18" cy="18" r="15" fill="none" stroke="#3B82F6" stroke-width="4" stroke-dasharray="62 100" stroke-linecap="round" transform="rotate(-90 18 18)"/>
                    </svg>
                </div>
                <div class="kpi-info">
                    <div class="kpi-title">Customer LTV</div>
                    <div class="kpi-value">$156</div>
                </div>
                <span class="kpi-trend up">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" width="10" height="10"><path d="M7 17l5-5 5 5"/></svg>
                    5.4%
                </span>
            </div>
            <div class="kpi-card mini">
                <div class="kpi-accent">
                    <svg viewBox="0 0 36 36" class="kpi-ring">
                        <circle cx="18" cy="18" r="15" fill="none" stroke="#E0E7FF" stroke-width="4"/>
                        <circle cx="18" cy="18" r="15" fill="none" stroke="#6366F1" stroke-width="4" stroke-dasharray="75 100" stroke-linecap="round" transform="rotate(-90 18 18)"/>
                    </svg>
                </div>
                <div class="kpi-info">
                    <div class="kpi-title">Active Customers</div>
                    <div class="kpi-value">1,247</div>
                </div>
                <span class="kpi-trend up">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" width="10" height="10"><path d="M7 17l5-5 5 5"/></svg>
                    9.1%
                </span>
            </div>
            <div class="kpi-card mini">
                <div class="kpi-accent">
                    <svg viewBox="0 0 36 36" class="kpi-ring">
                        <circle cx="18" cy="18" r="15" fill="none" stroke="#FEF3C7" stroke-width="4"/>
                        <circle cx="18" cy="18" r="15" fill="none" stroke="#F59E0B" stroke-width="4" stroke-dasharray="50 100" stroke-linecap="round" transform="rotate(-90 18 18)"/>
                    </svg>
                </div>
                <div class="kpi-info">
                    <div class="kpi-title">Avg Delivery</div>
                    <div class="kpi-value">28 min</div>
                </div>
                <span class="kpi-trend up">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" width="10" height="10"><path d="M7 17l5-5 5 5"/></svg>
                    4.1%
                </span>
            </div>
            <div class="kpi-card mini">
                <div class="kpi-accent">
                    <svg viewBox="0 0 36 36" class="kpi-ring">
                        <circle cx="18" cy="18" r="15" fill="none" stroke="#FCE7F3" stroke-width="4"/>
                        <circle cx="18" cy="18" r="15" fill="none" stroke="#EC4899" stroke-width="4" stroke-dasharray="40 100" stroke-linecap="round" transform="rotate(-90 18 18)"/>
                    </svg>
                </div>
                <div class="kpi-info">
                    <div class="kpi-title">CAC</div>
                    <div class="kpi-value">$12.50</div>
                </div>
                <span class="kpi-trend down">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" width="10" height="10"><path d="M7 7l5 5 5-5"/></svg>
                    3.2%
                </span>
            </div>
        </div>
    </div>

</main>

<!-- ===========================
     SCRIPTS
=========================== -->
<script src="../js/script.js"></script>
<script src="../js/runtime-config.js"></script>
<script type="module" src="../js/auth-guard.js"></script>
</body>
</html>
