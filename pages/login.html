<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kwala - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="auth-body">

    <div class="auth-container">
        <!-- Left decorative panel -->
        <div class="auth-panel-left">
            <a href="../index.html" class="auth-logo">Kwala</a>
            <div class="auth-illustration">
                <img src="../assets/landing_kwala.png" alt="Kwala Mascot">
            </div>
            <p class="auth-tagline">Your favourite food,<br>delivered fast.</p>
        </div>

        <!-- Right form panel -->
        <div class="auth-panel-right">
            <div class="auth-form-wrapper">
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Sign in to access your dashboard</p>

                <!-- Error message -->
                <div class="auth-error" id="authError">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M8 4.5V9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        <circle cx="8" cy="11.5" r="0.75" fill="currentColor"/>
                    </svg>
                    <span id="authErrorText">Invalid email or password</span>
                </div>

                <form id="loginForm" class="auth-form" novalidate>
                    <!-- Email field -->
                    <div class="auth-field">
                        <label for="loginEmail">Email</label>
                        <div class="auth-input-wrap">
                            <svg class="auth-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <rect x="2" y="4" width="20" height="16" rx="3" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M2 7l10 7 10-7" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            <input type="email" id="loginEmail" placeholder="you@example.com" required autocomplete="email">
                        </div>
                    </div>

                    <!-- Password field -->
                    <div class="auth-field">
                        <label for="loginPassword">Password</label>
                        <div class="auth-input-wrap">
                            <svg class="auth-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <rect x="3" y="11" width="18" height="11" rx="2" stroke-linecap="round"/>
                                <path d="M7 11V7a5 5 0 0110 0v4" stroke-linecap="round"/>
                            </svg>
                            <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
                            <button type="button" class="auth-toggle-pw" id="togglePassword" aria-label="Toggle password visibility">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z" stroke-linecap="round"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Remember me + forgot -->
                    <div class="auth-options">
                        <label class="auth-checkbox">
                            <input type="checkbox" id="rememberMe">
                            <span class="checkmark"></span>
                            Remember me
                        </label>
                        <a href="#" class="auth-forgot">Forgot password?</a>
                    </div>

                    <!-- Submit -->
                    <button type="submit" class="auth-submit" id="loginSubmit">
                        <span class="auth-submit-text">Sign In</span>
                        <div class="auth-spinner" id="loginSpinner"></div>
                    </button>
                </form>

                <p class="auth-footer-text">
                    Back to <a href="../index.html">Homepage</a>
                </p>
            </div>
        </div>
    </div>

    <script src="../js/runtime-config.js"></script>
    <script src="../js/script.js"></script>
    <script type="module" src="../js/auth-login.js"></script>
</body>
</html>
