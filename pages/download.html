    <title data-i18n="download_page_title">Download Kwala App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ADLaM+Display&family=Inter:wght@400;600;700;800&family=Noto+Kufi+Arabic:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .download-landing-hero {
            padding: 40px 5% 60px 5%;
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .download-mascot-wrapper {
            margin-bottom: 30px;
        }

        .download-mascot-img {
            max-width: 220px;
            height: auto;
            filter: drop-shadow(0 15px 30px rgba(46, 37, 80, 0.15));
        }

        .download-landing-hero h1 {
            font-family: var(--font-heading);
            font-size: clamp(2.2rem, 6vw, 3.2rem);
            color: var(--text-main);
            margin-bottom: 16px;
            line-height: 1.25;
        }

        .routing-status-p {
            font-family: var(--font-body);
            font-size: clamp(1.05rem, 2.5vw, 1.25rem);
            color: var(--purple-dark);
            max-width: 540px;
            margin-bottom: 35px;
            line-height: 1.6;
            min-height: 50px;
        }

        /* Stacked store buttons - One on top of the other */
        .stacked-store-buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 320px;
        }

        .stacked-store-link {
            display: block;
            width: 100%;
            transition: transform 0.3s var(--ease-out-expo), filter 0.3s ease;
            text-decoration: none;
        }

        .stacked-store-link:hover {
            transform: translateY(-3px) scale(1.02);
            filter: drop-shadow(0 12px 24px rgba(46, 37, 80, 0.2));
        }

        .stacked-store-img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 14px;
        }
    </style>
</head>

            </svg>
        </div>
        <div class="lang-dropdown-menu" id="langDropdown">
            <div data-lang="en">English</div>

    <!-- Stacked store buttons -->
    <div class="stacked-store-buttons">
        <a href="https://play.google.com/store/apps/details?id=com.kwala.app" target="_blank" class="stacked-store-link" id="playStoreLink">
            <img src="../assets/play_store_download.png" alt="Get it on Google Play" class="stacked-store-img">
        </a>
        <a href="https://apps.apple.com/ma/app/kwala/id6760371031" target="_blank" class="stacked-store-link" id="appStoreLink">
            <img src="../assets/app_store_download.png" alt="Download on the App Store" class="stacked-store-img">
        </a>
    </div>
</main>
